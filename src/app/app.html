<div class="viewer-container">

  <div id="panorama"></div>

  <div class="destination-box">

    <button
      type="button"
      class="destination-button"
      (click)="toggleDestination()"
    >
      📍 {{ currentLocation }}
      <span>{{ isDestinationOpen ? '▲' : '▼' }}</span>
    </button>

    @if (isDestinationOpen) {

      <div class="destination-menu">

        @for (location of locations; track location.id) {

          <button
            type="button"
            class="destination-item"
            (click)="goToLocation(location.id.toString())"
          >
            {{ location.name }}
          </button>

        }

      </div>

    }

  </div>

</div>
