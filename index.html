    <link rel="stylesheet"

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        #panorama {
            width: 100%;
            height: 600px;
        }

        /* =========================
           FORWARD NAVIGATION ARROW
           ========================= */

        .navigation-arrow {
            width: 90px;
            height: 65px;

            background: white !important;
            background-image: none !important;

            opacity: 0.9;
            cursor: pointer;

            clip-path: polygon(
                50% 0%,
                100% 55%,
                68% 55%,
                68% 100%,
                32% 100%,
                32% 55%,
                0% 55%
            );

            transform: perspective(200px) rotateX(55deg);
            transform-origin: center bottom;
        }

        .navigation-arrow::after {
            content: "";
        }


        /* =========================
           BACKWARD NAVIGATION ARROW
           ========================= */

        .back-navigation-arrow {
            width: 70px;
            height: 55px;

            background: white !important;
            background-image: none !important;

            opacity: 0.9;
            cursor: pointer;

            clip-path: polygon(
                0% 50%,
                35% 0%,
                35% 30%,
                100% 30%,
                100% 70%,
                35% 70%,
                35% 100%
            );

            transform: perspective(200px) rotateX(55deg);
            transform-origin: center bottom;
        }

    </style>
</head>
